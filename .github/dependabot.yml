# Version updates. Security updates are enabled separately in the repository settings and are
# not limited by this file.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they call.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # A release is not proposed until it has been out for a week.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Pinned exactly: upgraded by hand after checking that the DuckDB C API it targets has no
      # unstable tail we would call (stable ABI, C_STRUCT).
      - dependency-name: libduckdb-sys
    groups:
      # Minor and patch updates of every crate in one pull request.
      rust-minor:
        update-types: ["minor", "patch"]
      # Major updates of the Python binding's stack, reviewed together because they usually need
      # code changes.
      pyo3-arrow-major:
        patterns: ["pyo3*", "arrow*"]
        update-types: ["major"]

  - package-ecosystem: pip
    # The binding's contributor group and the docs lock.
    directories: ["/crates/oxedi_py", "/docs"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A range such as `pyarrow>=14` is a supported floor, not a pin: a release moves a range only
    # when it no longer allows it, so the floors are never raised.
    versioning-strategy: increase-if-necessary
    groups:
      # The exact pyx12 and the docs lock move in one pull request, where the pyx12 goldens are
      # regenerated and read.
      pyx12:
        patterns: ["pyx12"]
      python:
        patterns: ["*"]
