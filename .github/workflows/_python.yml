name: Python

# The binding on the oldest and newest supported Python: spec against pyx12's maps (5010 and
# 4010), the stub and the package under mypy, the suite, and the wheel in a clean environment.
# Called by ci.yml and nightly.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One key for both legs: the module is abi3, so they compile the same artifacts.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: python
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python }}
          cache-suffix: python
      - name: Tools
        run: uv pip install "maturin>=1.9.4,<2" --group crates/oxedi_py/pyproject.toml:test "pyx12>=4.0,<5" mypy pandas-stubs pyarrow-stubs
      - name: Build
        run: maturin develop --uv --release --manifest-path crates/oxedi_py/Cargo.toml
      - name: Spec against pyx12's maps
        run: |
          python crates/oxedi_core/scripts/spec_vs_pyx12.py --check
          python crates/oxedi_core/scripts/spec_vs_pyx12.py --check --version 4010
      - name: Stub against the runtime
        run: |
          allowlist=()
          if [ -f crates/oxedi_py/stubtest-allowlist.txt ]; then
            allowlist=(--allowlist crates/oxedi_py/stubtest-allowlist.txt)
          fi
          python -m mypy.stubtest oxedi._core "${allowlist[@]}"
      - name: Public API under mypy --strict, package under mypy
        run: |
          python -m mypy --strict crates/oxedi_py/tests/typing/usage.py
          python -m mypy --config-file crates/oxedi_py/pyproject.toml crates/oxedi_py/python/oxedi
      - name: Test
        run: pytest crates/oxedi_py/tests
      - name: Test without pyx12
        if: matrix.python == '3.13'
        run: |
          uv pip uninstall pyx12
          pytest crates/oxedi_py/tests
      - name: Wheel in a clean environment
        run: crates/oxedi_py/scripts/smoke_wheel.sh

  # The oldest pyarrow the extra supports, with the newest pandas that installs next to it on 3.11.
  # Tests that need duckdb, edi-835-parser or pyx12 skip themselves when those are absent.
  pyarrow-floor:
    name: pyarrow 14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: python-pyarrow-floor
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.11"
          cache-suffix: pyarrow-floor
      - name: Tools
        run: uv pip install "maturin>=1.9.4,<2" pytest polars "pyarrow==14.*" "pandas>=2.0.3,<2.2"
      - name: Build
        run: maturin develop --uv --release --manifest-path crates/oxedi_py/Cargo.toml
      - name: Test
        run: pytest crates/oxedi_py/tests
