name: Viewer

# The browser viewer: the WebAssembly module and its size limit, the page's unit checks, the
# oracle against oxedi.parse and the Playwright browser tests. Called by ci.yml and nightly.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  viewer:
    name: Module and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: viewer
      - uses: ./.github/actions/setup-uv
        with:
          cache-suffix: viewer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: wasm-bindgen CLI (the version Cargo.lock resolves) and wasm-opt
        uses: ./.github/actions/wasm-tools
      - name: Clippy on the WebAssembly target
        run: cargo clippy -p oxedi_core -p oxedi_wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the module
        run: make wasm
      - name: Size
        run: make wasm-size-check
      # The docs environment holds Playwright; the browser is cached by Playwright's version and
      # written only from master.
      - uses: ./.github/actions/docs-venv
      - name: Playwright version
        id: playwright
        run: |
          version=$(sed -n 's/^playwright==\([^ ;]*\).*/\1/p' docs/requirements.txt)
          test -n "$version" || { echo "docs/requirements.txt pins no playwright==<version>" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the browser
        id: browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Browser for the page tests
        if: steps.browser.outputs.cache-hit != 'true'
        run: .venv-docs/bin/playwright install --with-deps chromium
      - name: Save the browser
        if: github.ref == 'refs/heads/master' && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.cache-primary-key }}
      - name: Browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: .venv-docs/bin/playwright install-deps chromium
      - name: Unit checks, oracle and browser tests
        run: make viewer-test
      # The publish script on a temporary worktree of the gh-pages commit it fetches, committing
      # but never pushing, so a broken viewer deploy shows on the pull request.
      - name: Viewer publish (dry run, no push)
        env:
          PUSH: "false"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KIND=release VERSION=0.0 .github/scripts/publish-viewer.sh
          KIND=dev .github/scripts/publish-viewer.sh
