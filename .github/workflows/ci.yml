name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      duckdb: ${{ steps.filter.outputs.duckdb }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - 'crates/oxedi_core/**'
              - 'crates/oxedi_py/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'LICENSE'
              - 'THIRD_PARTY_NOTICES'
              - '.github/workflows/ci.yml'
            duckdb:
              - 'crates/oxedi_core/**'
              - 'crates/oxedi_duckdb/**'
              - 'crates/oxedi_py/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.gitmodules'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Benches compile
        run: cargo bench --workspace --no-run --locked
      - name: Stub drift
        run: |
          cargo run --locked -p oxedi_py --bin stub_gen
          git diff --exit-code crates/oxedi_py/python/oxedi/_core.pyi

  python:
    name: Python ${{ matrix.python }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Environment
        run: |
          uv venv --python ${{ matrix.python }} .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tools
        run: uv pip install "maturin>=1.9.4,<2" pytest polars pyarrow pandas "edi-835-parser==1.8.0" duckdb "pyx12>=4.0,<5" mypy pandas-stubs
      - name: Build
        run: maturin develop --uv --release --manifest-path crates/oxedi_py/Cargo.toml
      - name: Spec against pyx12's maps
        run: |
          python scripts/spec_vs_pyx12.py --check
          python scripts/spec_vs_pyx12.py --check --version 4010
      - name: Stub against the runtime
        run: python -m mypy.stubtest oxedi._core $(test -f crates/oxedi_py/stubtest-allowlist.txt && echo --allowlist crates/oxedi_py/stubtest-allowlist.txt)
      - name: Public API under mypy --strict, package under mypy
        run: |
          python -m mypy --strict crates/oxedi_py/tests/typing/usage.py
          python -m mypy --config-file crates/oxedi_py/pyproject.toml crates/oxedi_py/python/oxedi
      - name: Test
        run: pytest crates/oxedi_py/tests
      - name: Wheel in a clean environment
        run: scripts/smoke_wheel.sh

  duckdb:
    name: DuckDB extension (${{ matrix.duckdb.name }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.duckdb == 'true'
    runs-on: ubuntu-latest
    # `next` is a moving pre-release of DuckDB: it reports, it does not block.
    continue-on-error: ${{ matrix.duckdb.name == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        duckdb:
          # stable: the extension's minimum DuckDB (TARGET_DUCKDB_VERSION in its Makefile).
          # latest: the newest release on PyPI. next: the newest pre-release on PyPI.
          - name: stable
            test_version: "1.5.6"
            pip: "duckdb==1.5.6"
          - name: latest
            test_version: ""
            pip: "duckdb"
          - name: next
            test_version: main
            pip: "--pre duckdb"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Environment
        run: |
          uv venv --python 3.13 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tools
        run: uv pip install "maturin>=1.9.4,<2" pytest pyarrow ${{ matrix.duckdb.pip }}
      - name: Descriptor version
        run: make duckdb-version-check
      - name: Configure
        run: make configure_ci DUCKDB_TEST_VERSION='${{ matrix.duckdb.test_version }}'
      - name: Build the extension
        run: make release
      - name: SQLLogicTest
        run: make test_release DUCKDB_TEST_VERSION='${{ matrix.duckdb.test_version }}'
      - name: Oracle against oxedi.parse_file
        run: make duckdb-oracle
