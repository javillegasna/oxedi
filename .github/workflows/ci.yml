name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Benches compile
        run: cargo bench --workspace --no-run --locked
      - name: Stub drift
        run: |
          cargo run --locked -p oxedi835_py --bin stub_gen
          git diff --exit-code crates/oxedi835_py/python/oxedi835/_core.pyi

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Environment
        run: |
          uv venv --python ${{ matrix.python }} .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tools
        run: uv pip install "maturin>=1.9.4,<2" pytest polars pyarrow pandas "edi-835-parser==1.8.0" duckdb "pyx12>=4.0,<5" mypy pandas-stubs
      - name: Build
        run: maturin develop --uv --release --manifest-path crates/oxedi835_py/Cargo.toml
      - name: Spec against pyx12's maps
        run: |
          python scripts/spec_vs_pyx12.py --check
          python scripts/spec_vs_pyx12.py --check --version 4010
      - name: Stub against the runtime
        run: python -m mypy.stubtest oxedi835._core $(test -f crates/oxedi835_py/stubtest-allowlist.txt && echo --allowlist crates/oxedi835_py/stubtest-allowlist.txt)
      - name: Public API under mypy --strict, package under mypy
        run: |
          python -m mypy --strict crates/oxedi835_py/tests/typing/usage.py
          python -m mypy --config-file crates/oxedi835_py/pyproject.toml crates/oxedi835_py/python/oxedi835
      - name: Test
        run: pytest crates/oxedi835_py/tests
      - name: Wheel in a clean environment
        run: scripts/smoke_wheel.sh

  duckdb:
    name: DuckDB extension (${{ matrix.duckdb.name }})
    runs-on: ubuntu-latest
    # `next` is a moving pre-release of DuckDB: it reports, it does not block.
    continue-on-error: ${{ matrix.duckdb.name == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        duckdb:
          # stable: the extension's minimum DuckDB (TARGET_DUCKDB_VERSION in its Makefile).
          # next: the newest pre-release on PyPI.
          - name: stable
            test_version: "1.5.6"
            pip: "duckdb==1.5.6"
          - name: next
            test_version: main
            pip: "--pre duckdb"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Environment
        run: |
          uv venv --python 3.13 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tools
        run: uv pip install "maturin>=1.9.4,<2" pytest pyarrow ${{ matrix.duckdb.pip }}
      - name: Configure
        run: make configure_ci DUCKDB_TEST_VERSION=${{ matrix.duckdb.test_version }}
      - name: Build the extension
        run: make release
      - name: SQLLogicTest
        run: make test_release DUCKDB_TEST_VERSION=${{ matrix.duckdb.test_version }}
      - name: Oracle against oxedi835.parse_file
        run: make duckdb-oracle
