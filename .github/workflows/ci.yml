name: CI

# Runs each area (Rust, Python, DuckDB, Docs, Viewer, and Workflows, which also holds the
# complexity ratchet) only when files it depends on changed: on a pull request against its base,
# on a push against the previous commit of the branch. A draft pull request runs Rust only; the
# rest runs once it is ready for review. nightly.yml runs every area on master. Runs of a pull
# request share a group and a new push cancels the running one; each push to a branch has its own
# group, so no push is replaced by a later one. `CI result` is the one check to require: it
# fails when any area failed or was cancelled and passes when each one passed or was not needed.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      duckdb: ${{ steps.filter.outputs.duckdb }}
      docs: ${{ steps.filter.outputs.docs }}
      viewer: ${{ steps.filter.outputs.viewer }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Pushes compare with the commit before the push; pull requests ignore it and use the
          # pull request's files.
          base: ${{ github.event.before }}
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'clippy.toml'
              - 'Makefile'
              # make readme-py-check compares it with crates/oxedi_py/README.md.
              - 'README.md'
              - '.github/**'
            python:
              - 'crates/oxedi_core/**'
              - 'crates/oxedi_py/**'
              - 'crates/oxedi_py/scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'LICENSE'
              - 'THIRD_PARTY_NOTICES'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_python.yml'
            duckdb:
              - 'crates/oxedi_core/**'
              - 'crates/oxedi_duckdb/**'
              - 'crates/oxedi_py/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.gitmodules'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_duckdb.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'
              - 'crates/oxedi_core/**'
              - 'crates/oxedi_duckdb/**'
              - 'crates/oxedi_py/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.gitmodules'
              - '.github/actions/**'
              - '.github/workflows/docs.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_docs.yml'
              # The deploy dry run runs these.
              - '.github/scripts/deploy-docs.sh'
              - '.github/scripts/is-latest-minor.sh'
              - '.github/scripts/publish-viewer.sh'
            viewer:
              - 'crates/oxedi_core/**'
              - 'crates/oxedi_py/**'
              - 'crates/oxedi_wasm/**'
              - 'viewer/**'
              - 'docs/llms.txt'
              - 'docs/requirements.txt'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_viewer.yml'
              - '.github/scripts/publish-viewer.sh'
            workflows:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.github/actions/setup-uv/**'
              # The complexity ratchet measures these against .github/complexity-baseline.txt.
              - '.github/complexity-baseline.txt'
              - 'crates/*/src/**'
              - 'crates/*/python/**'
              - 'crates/*/scripts/**'
              - 'viewer/js/**'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_rust.yml

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/_python.yml

  duckdb:
    name: DuckDB
    needs: changes
    if: needs.changes.outputs.duckdb == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/_duckdb.yml
    with:
      # `next` (DuckDB's pre-release) runs in nightly.yml.
      legs: '["stable", "latest"]'

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/_docs.yml

  viewer:
    name: Viewer
    needs: changes
    if: needs.changes.outputs.viewer == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/_viewer.yml

  workflows:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/_lint.yml

  ci-result:
    name: CI result
    needs: [changes, rust, python, duckdb, docs, viewer, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every area passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "At least one area failed or was cancelled." >&2
            exit 1
          fi
