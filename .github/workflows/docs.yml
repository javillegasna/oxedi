name: Docs deploy

# Publishes the site to the gh-pages branch with mike: `dev` from every push to master that
# changes what the site or the viewer is built from (the paths below), and `X.Y` plus the
# `latest` alias from every final vX.Y.Z tag (the tag patterns below keep pre-releases such as
# v0.5.0rc1 and the duckdb-v* tags from starting the workflow; path filters do not apply to
# tags). `latest` moves only when X.Y is the highest version on gh-pages, counting X.Y itself, so
# a patch of an older minor deploys its own folder and leaves `latest` alone. A manual run with
# a `version` (X.Y) is a release deploy under the same rule, for a release made before this
# workflow existed. Pull requests only build the site and dry-run the deploy, in the jobs that
# ci.yml calls (_docs.yml, _viewer.yml).
#
# The browser viewer is published next to the versions, in `viewer/` of gh-pages (the latest
# release, so it is refreshed only when `latest` moves) and `viewer/dev/` (master), outside the
# folders mike manages. A release that moves `latest` also refreshes llms.txt at the root of
# gh-pages from the same script; mike copies docs/llms.txt into each version's folder.
#
# The deploy itself, the `latest` decision, the viewer and llms.txt and the final check are
# .github/scripts/deploy-docs.sh, which the pull-request dry run (_docs.yml) also runs, without
# pushing. Releases and master pushes queue separately (see `concurrency`), so a release is never
# replaced by a later master push, and the two can run at the same time. Both push to gh-pages,
# so every push goes through .github/scripts/retry-gh-pages.sh, which redoes a push rejected
# because gh-pages moved on top of the current origin/gh-pages, up to 3 times. The script ends by
# checking what the run was meant to publish and fails naming what is missing, so a release
# deploy that did not happen shows as a failed run.
on:
  push:
    branches: [master]
    # Filter patterns, not regular expressions: only vX.Y.Z matches.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "crates/**"
      - "viewer/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "Makefile"
      - "make/**"
      - "rust-toolchain.toml"
      - ".github/workflows/docs.yml"
      - ".github/scripts/**"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Minor version to publish, as X.Y (moves latest when it is the highest), e.g. 0.5"
        required: true
        type: string

# Two groups. Master pushes queue in the dev group: a newer push replaces one that is waiting.
# Final tag and manual runs queue in the release group (pre-release tags never start a run),
# where GitHub keeps one pending run, so a second tag or manual run started while a release
# deploy waits replaces it; the replaced run shows as cancelled, and re-running "Docs deploy"
# by hand for that version publishes it. Nothing is cancelled once running. Pushes to gh-pages
# from the two groups are retried when rejected.
concurrency:
  group: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'docs-deploy-release' || 'docs-deploy-dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site
    # Never from a fork.
    if: github.repository == 'javillegasna/oxedi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # mike needs the gh-pages history
          # No token in .git/config while project code builds; the deploy step hands it to
          # git push alone.
          persist-credentials: false
      # The Viewer job's compile cache holds the same builds (the package and the module); this
      # job reads it and never writes it.
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          targets: wasm32-unknown-unknown
          cache-key: viewer
          save: "false"
      - uses: ./.github/actions/setup-uv # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          cache-suffix: viewer
      - name: Version to publish
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "kind=release" >> "$GITHUB_OUTPUT"
              echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "version input must be X.Y, got $INPUT_VERSION"
              exit 1
            fi
          elif [ "$REF_TYPE" = "branch" ]; then
            echo "kind=dev" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=skip" >> "$GITHUB_OUTPUT"
            echo "Tag $REF_NAME is not a final release; nothing to publish."
          fi
      - name: Docs environment
        if: steps.target.outputs.kind != 'skip'
        uses: ./.github/actions/docs-venv # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          dev: "true"
      - name: Docs tools on PATH
        if: steps.target.outputs.kind != 'skip'
        # mike runs mkdocs by name, so the venv's bin must be on PATH.
        run: echo "$PWD/.venv-docs/bin" >> "$GITHUB_PATH"
      - name: Git identity for mike
        if: steps.target.outputs.kind != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: wasm-bindgen CLI and wasm-opt
        if: steps.target.outputs.kind != 'skip'
        uses: ./.github/actions/wasm-tools # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - name: Build the viewer's module
        if: steps.target.outputs.kind != 'skip'
        run: make wasm
      - name: Deploy the site and the viewer, then check gh-pages
        if: steps.target.outputs.kind != 'skip'
        env:
          KIND: ${{ steps.target.outputs.kind }}
          VERSION: ${{ steps.target.outputs.version }}
          # Only this step's shell holds it: exec replaces that shell with the script, started
          # without the variable, which reads the token from file descriptor 3 and gives it only
          # to git push.
          PAGES_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec env -u PAGES_PUSH_TOKEN .github/scripts/deploy-docs.sh "$KIND" ${VERSION:+"$VERSION"} 3<<<"$PAGES_PUSH_TOKEN"
