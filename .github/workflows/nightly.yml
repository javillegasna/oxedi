name: Nightly

# Every area of CI on master, whatever changed, plus DuckDB's pre-release (`next`), which reports
# and does not block. A manual run checks the ref it is started on.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/_rust.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  python:
    name: Python
    uses: ./.github/workflows/_python.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  duckdb:
    name: DuckDB
    uses: ./.github/workflows/_duckdb.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    with:
      legs: '["stable", "latest", "next"]'

  docs:
    name: Docs
    uses: ./.github/workflows/_docs.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  viewer:
    name: Viewer
    uses: ./.github/workflows/_viewer.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  workflows:
    name: Workflows
    uses: ./.github/workflows/_lint.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
