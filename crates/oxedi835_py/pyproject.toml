[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "oxedi835"
dynamic = ["version"]
description = "Lossless, fast, data-driven EDI 835 parser"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Repository = "https://github.com/javillegasna/oxedi835"
Issues = "https://github.com/javillegasna/oxedi835/issues"

[project.optional-dependencies]
edi-835-parser = ["pandas>=2.0.3,<3", "pyarrow>=14"]
pandas = ["pandas>=2", "pyarrow>=14"]
polars = ["polars>=1.0"]
test = ["pytest>=8", "polars>=1.0", "pyarrow>=14", "pandas>=2.0.3,<3", "edi-835-parser==1.8.0", "duckdb>=1.1"]

[tool.maturin]
module-name = "oxedi835._core"
python-source = "python"
exclude = [{ path = "**/edi835_core/tests/**", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
