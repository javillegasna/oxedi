[package]
name = "oxedi_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Lossless, fast, data-driven EDI 835 parser core (oxedi)"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
criterion = "0.8"

# Sampling profiler behind `--profile-time` in the benches (benches/common/profiler.rs).
[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["flamegraph"] }

[[bench]]
name = "tokenize"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "check"
harness = false

[[bench]]
name = "process"
harness = false

[[bench]]
name = "write"
harness = false
