[package]
name = "oxedi_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lossless, fast, data-driven EDI 835 parser core (oxedi)"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "tokenize"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "check"
harness = false

[[bench]]
name = "process"
harness = false
