[package]
name = "oxedi_py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Python binding of the oxedi EDI 835 parser core"
publish = false

[lib]
name = "oxedi_py"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false
bench = false

[lints]
workspace = true

[dependencies]
oxedi_core = { path = "../oxedi_core" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
arrow-array = { version = "60", default-features = false, features = ["ffi"] }
arrow-buffer = { version = "60", default-features = false }
arrow-data = { version = "60", default-features = false, features = ["ffi"] }
arrow-schema = { version = "60", default-features = false, features = ["ffi"] }
bytes = "1.9"
self_cell = "1"
# Without default features the build never calls Python. The `stub-gen` feature turns on
# `infer_signature`, which formats a signature's default values through the interpreter; only
# `make stubs` builds with it, linking libpython for that one command.
pyo3-stub-gen = { version = "0.23", default-features = false }

[features]
# Formats the defaults of the stub through the interpreter; see the comment on `pyo3-stub-gen`.
stub-gen = ["pyo3-stub-gen/infer_signature"]
