[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "oxedi"
dynamic = ["version"]
description = "Lossless, fast X12 EDI 835 (healthcare remittance) parser and writer for Python, written in Rust"
keywords = ["edi", "x12", "edi-835", "835", "era", "remittance", "healthcare", "parser", "arrow", "polars", "duckdb"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://javillegas.dev/oxedi/"
Documentation = "https://javillegas.dev/oxedi/latest/"
"Get started" = "https://javillegas.dev/oxedi/latest/start/"
Roadmap = "https://javillegas.dev/oxedi/latest/roadmap/"
Repository = "https://github.com/javillegasna/oxedi"
Issues = "https://github.com/javillegasna/oxedi/issues"
Changelog = "https://github.com/javillegasna/oxedi/blob/master/CHANGELOG.md"

[project.optional-dependencies]
edi-835-parser = ["pandas>=2.0.3,<3", "pyarrow>=14"]
pandas = ["pandas>=2", "pyarrow>=14"]
polars = ["polars>=1.0"]
pyx12 = ["pyx12>=4.0,<5"]

# Contributor tools, never published metadata. `make venv` installs the `contributor` group; CI and
# `.venv-nopyx12` install `test` with `uv pip install --group crates/oxedi_py/pyproject.toml:test`.
[dependency-groups]
test = ["pytest>=8", "polars>=1.0", "pyarrow>=14", "pandas>=2.0.3,<3", "edi-835-parser==1.8.0", "duckdb>=1.1"]
profile = ["py-spy>=0.4"]
# Everything `make venv` installs, so a sandbox fetch and a developer machine get the same tools.
# Not named `dev`: `maturin develop` installs a group of that name into whatever venv it builds into.
contributor = ["maturin", "mypy", "pandas-stubs", "pyarrow-stubs", "pyx12>=4.0,<5", {include-group = "test"}, {include-group = "profile"}]

[tool.maturin]
module-name = "oxedi._core"
python-source = "python"
exclude = [
    { path = "**/oxedi_core/tests/**", format = "sdist" },
    { path = "**/oxedi_core/scripts/**", format = "sdist" },
    { path = "**/oxedi_py/scripts/**", format = "sdist" },
    { path = "**/__pycache__/**", format = "sdist" },
    { path = "**/*.pyc", format = "sdist" },
    { path = "**/__pycache__/**", format = "wheel" },
    { path = "**/*.pyc", format = "wheel" },
]

# The package check (`make stubtest`): pyx12 ships no type information.
[[tool.mypy.overrides]]
module = ["pyx12", "pyx12.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
