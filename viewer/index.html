<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>oxedi 835 viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>oxedi 835 viewer</h1>
      <span id="version" class="muted"></span>
      <a href="https://javillegas.dev/oxedi/">Documentation</a>
    </div>
    <p class="privacy">Your file is read in this browser. Nothing is uploaded: this page cannot open network connections.</p>
  </header>

  <main>
    <section class="intake" aria-label="Open a file">
      <label id="drop" class="drop" for="file">
        <input id="file" type="file">
        <span class="drop-title">Drop an 835 file here, or click to choose one</span>
        <span class="muted">Any extension. One file at a time.</span>
      </label>
      <button id="sample" type="button" disabled>Try the sample</button>
      <label class="mask-toggle" for="mask">
        <input id="mask" type="checkbox">
        <span>Hide patient data</span>
      </label>
      <p id="mask-note" class="muted" hidden>The Text and Loops views still show the original file, and text typed into a table filter stays as typed.</p>
    </section>

    <p id="status" class="status" role="status" hidden></p>
    <p id="alert" class="alert" role="alert" hidden></p>

    <div id="results" hidden>
      <div class="tabs" role="tablist" aria-label="Views">
        <button role="tab" id="tab-summary" aria-controls="panel-summary" data-tab="summary" aria-selected="true" tabindex="0" type="button">Summary</button>
        <button role="tab" id="tab-tables" aria-controls="panel-tables" data-tab="tables" aria-selected="false" tabindex="-1" type="button">Tables</button>
        <button role="tab" id="tab-diagnostics" aria-controls="panel-diagnostics" data-tab="diagnostics" aria-selected="false" tabindex="-1" type="button">Diagnostics <span id="diag-count" class="badge">0</span></button>
        <button role="tab" id="tab-text" aria-controls="panel-text" data-tab="text" aria-selected="false" tabindex="-1" type="button">Text</button>
        <button role="tab" id="tab-loops" aria-controls="panel-loops" data-tab="loops" aria-selected="false" tabindex="-1" type="button">Loops</button>
      </div>
      <section role="tabpanel" id="panel-summary" aria-labelledby="tab-summary" tabindex="0"></section>
      <section role="tabpanel" id="panel-tables" aria-labelledby="tab-tables" tabindex="0" hidden></section>
      <section role="tabpanel" id="panel-diagnostics" aria-labelledby="tab-diagnostics" tabindex="0" hidden></section>
      <section role="tabpanel" id="panel-text" aria-labelledby="tab-text" tabindex="0" hidden></section>
      <section role="tabpanel" id="panel-loops" aria-labelledby="tab-loops" tabindex="0" hidden></section>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
